# Builds the Windows installer and adds it to the draft release for the version
# in apps/desktop/src-tauri/tauri.conf.json. Run it from the Actions tab.
name: Desktop release Windows

on:
  workflow_dispatch:

concurrency:
  # One group for all three platforms: each run adds its installers to the same
  # draft release, and tauri-action's find-or-create is not atomic. Running them
  # at once can create duplicate releases for one tag (as 0.1.1-alpha.7 did), so
  # they queue instead. Publishing the draft is still what ships it.
  group: desktop-release
  cancel-in-progress: false
  # Keep every waiting platform instead of only the newest: with the default
  # queue ("single"), triggering the third workflow would cancel the second and
  # that platform would silently never ship.
  queue: max

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_desktop.yml
    with:
      platform: windows
      release: true
    secrets: inherit
