# Builds the Kontinue AI desktop app for macOS (universal: Apple silicon and
# Intel), Windows and Linux, and puts it on a draft GitHub Release with the
# auto-update file (latest.json). Publishing the draft is what ships it: the
# app checks .../releases/latest/download/latest.json.
#
# Release: bump "version" in apps/desktop/src-tauri/tauri.conf.json, then push
# a tag `desktop-v<version>` (or run this workflow from the Actions tab).
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           update signing key (~/.tauri/kontinue-ai.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty)
#   Optional, macOS signing and notarization (without them macOS warns the
#   app is from an unidentified developer):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# Variables (public values baked into the app):
#   VITE_CLERK_PUBLISHABLE_KEY, VITE_CONVEX_URL, VITE_WEB_APP_URL

name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            rust-targets: ""
            args: ""
          - name: Linux
            os: ubuntu-22.04
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: App config
        shell: bash
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_WEB_APP_URL: ${{ vars.VITE_WEB_APP_URL }}
        run: |
          for name in VITE_CLERK_PUBLISHABLE_KEY VITE_CONVEX_URL VITE_WEB_APP_URL; do
            if [ -z "${!name}" ]; then echo "::error::Set the $name repository variable"; exit 1; fi
            echo "$name=${!name}" >> apps/desktop/.env.production
          done

      # Tauri signs (and notarizes) whenever these are set, even to "", so
      # only pass the ones that exist.
      - name: macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              { echo "$name<<__EOF__"; echo "${!name}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
          else
            echo "::warning::No Apple certificate: the macOS app is unsigned, so macOS will warn on first open."
          fi
          if [ -n "$APPLE_ID" ]; then
            for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              { echo "$name<<__EOF__"; echo "${!name}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
          fi

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: desktop-v__VERSION__
          releaseName: Kontinue AI __VERSION__
          releaseBody: Download the installer for your computer below. Installed copies update themselves.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
