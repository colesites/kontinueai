# Shared steps for the Kontinue AI desktop app, used by:
#   desktop-build-{macos,windows,linux}.yml    compile check on PRs, uploads nothing
#   desktop-release-{macos,windows,linux}.yml  build and add to the draft release
#
# Each platform runs on its own, so one failing never blocks the others. All
# release runs for the same version (apps/desktop/src-tauri/tauri.conf.json)
# go into one draft release, "Kontinue AI <version>", and add their platform to
# its latest.json. Publishing the draft (Releases → Edit → Publish release) is
# what ships it; installed apps check .../releases/latest/download/latest.json.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD, empty), CONVEX_DEPLOY_KEY
# (production deploy key, for the backend check on releases). Optional macOS
# signing: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID.
# Variables: VITE_CLERK_PUBLISHABLE_KEY, VITE_CONVEX_URL, VITE_WEB_APP_URL.

name: Desktop (shared)

on:
  workflow_call:
    inputs:
      platform:
        description: macos, windows or linux
        required: true
        type: string
      release:
        description: Build installers and add them to the draft release
        required: true
        type: boolean

jobs:
  desktop:
    name: ${{ inputs.release && 'Release' || 'Build' }} ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'macos' && 'macos-latest' || inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-22.04' }}
    timeout-minutes: 90
    # Permissions come from the caller: read for build checks, write for releases.
    env:
      # Vite's production bundle (Monaco, Mermaid, Shiki languages) needs more
      # than Node's ~2 GB default heap; runners have about 7 GB.
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      # Same bun that writes bun.lock locally; older ones rewrite it and fail --frozen-lockfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Releases ship one macOS app for Apple silicon and Intel; checks build
      # only for the runner's own chip to stay quick.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.platform == 'macos' && inputs.release && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ inputs.platform }}-${{ inputs.release && 'release' || 'check' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: App config
        shell: bash
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_WEB_APP_URL: ${{ vars.VITE_WEB_APP_URL }}
        run: |
          for name in VITE_CLERK_PUBLISHABLE_KEY VITE_CONVEX_URL VITE_WEB_APP_URL; do
            if [ -z "${!name}" ]; then echo "::error::Set the $name repository variable"; exit 1; fi
            echo "$name=${!name}" >> apps/desktop/.env.production
          done

      # A release must not call Convex functions production doesn't have yet
      # (it shows "[CONVEX Q(...)] Server Error"). Deploy the backend first.
      - name: Production backend has every function the app calls
        if: inputs.release
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Add a CONVEX_DEPLOY_KEY secret (Convex dashboard → production → Settings → Deploy key) so releases can check the backend."
            exit 1
          fi
          node apps/desktop/scripts/check-convex-functions.mjs

      - name: Build check
        if: ${{ !inputs.release }}
        working-directory: apps/desktop
        run: bun run tauri build --no-bundle

      # Tauri signs (and notarizes) whenever these are set, even to "", so
      # only pass the ones that exist.
      - name: macOS signing
        if: inputs.release && inputs.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              { echo "$name<<__EOF__"; echo "${!name}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
          else
            echo "::warning::No Apple certificate: the macOS app is unsigned, so macOS will warn on first open."
          fi
          if [ -n "$APPLE_ID" ]; then
            for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              { echo "$name<<__EOF__"; echo "${!name}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
          fi

      - name: Build and add to the draft release
        if: inputs.release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: ${{ inputs.platform == 'macos' && '--target universal-apple-darwin' || '' }}
          tagName: desktop-v__VERSION__
          releaseName: Kontinue AI __VERSION__
          releaseBody: Download the installer for your computer below. Installed copies update themselves.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
